<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud SSOT + GitHub Approval Demo</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; max-width: 900px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      .row { display: flex; gap: .5rem; margin-bottom: .5rem; }
      input, textarea, button, select { font-size: 14px; padding: .4rem; }
      textarea { width: 100%; min-height: 80px; }
      input { width: 100%; }
      ul { padding-left: 1.2rem; }
      code { background: #f5f5f5; padding: .1rem .3rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>前端 Demo：云存储(SSOT) + GitHub 审批</h1>
    <p>仅前端实现：云存储状态（用 localStorage 模拟）作为唯一真相源，GitHub 审批动作写回同一份状态。</p>

    <section class="card">
      <h2>创建 PR（待审批）</h2>
      <div class="row">
        <input id="title" placeholder="PR 标题，例如：feat: add billing export" />
      </div>
      <div class="row">
        <textarea id="desc" placeholder="PR 描述"></textarea>
      </div>
      <button id="create">创建到云存储 SSOT</button>
    </section>

    <section class="card">
      <h2>审批面板（模拟 GitHub Reviews）</h2>
      <div id="pr-list"></div>
    </section>

    <section class="card">
      <h2>云存储 SSOT 快照</h2>
      <pre id="snapshot"></pre>
    </section>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
